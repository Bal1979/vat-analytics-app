<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}VAT Analytics{% endblock %}</title>
  <link rel="stylesheet" href="/static/auth.css?v=20260618">
</head>
<body>
  <div class="auth-wrap {% block wrap_class %}{% endblock %}">
    <a class="balai-home" href="https://www.balai.dk" title="Tilbage til balai.dk">
      <span class="balai-home-mark" aria-hidden="true">B</span>
      <span class="balai-home-text">
        <span class="balai-home-top">BALAI</span>
        <span class="balai-home-sub">VAT Analytics</span>
      </span>
    </a>
    {% block content %}{% endblock %}
    <footer>VAT Analytics · adgangsstyring</footer>
  </div>
</body>
</html>
